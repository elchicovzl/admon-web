name: Build & Push Docker image

# Se dispara en cada push a master (tu flujo actual: merges de PR).
# También podés correrlo a mano desde la pestaña Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # owner/repo → ghcr.io/owner/repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Reads the DOKPLOY_WEBHOOK_URL secret and NEXT_PUBLIC_* vars scoped to this
    # environment. Without it the job only sees repo-level secrets/vars (empty).
    environment: Production
    permissions:
      contents: read
      packages: write # necesario para pushear a GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token automático, sin configurar nada

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre corridas → builds mucho más rápidos
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* son públicas (van en el bundle del cliente):
          # se guardan como GitHub "Variables", NO como secrets.
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_HOTJAR_ID=${{ vars.NEXT_PUBLIC_HOTJAR_ID }}

      # Avisa a Dokploy que hay imagen nueva para que haga pull + redeploy.
      # Requiere que la app en Dokploy esté configurada como "Docker" (registry),
      # no como "Git/Railpack". Si no seteás el secret, este paso se saltea.
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "Triggering Dokploy deploy…"
            curl -fsSL -X POST "$WEBHOOK"
          else
            echo "DOKPLOY_WEBHOOK_URL no seteado — se saltea el trigger de deploy."
          fi
